<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join as a Pro - HomeMatch Miami</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-850">

    <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center">
        <a href="index.html" class="text-xl font-bold text-blue-600">HomeMatch Miami</a>
        <a href="index.html" class="text-sm text-blue-600 hover:underline">&larr; Back to Home</a>
    </header>

    <main class="max-w-xl mx-auto px-4 py-10">
        <div class="bg-white p-8 rounded-xl shadow-md">
            <h1 class="text-2xl font-bold mb-2 text-gray-900">List Your Business in Miami</h1>
            <p class="text-gray-600 mb-6 text-sm">Choose your plan and get instant visibility for local homeowners.</p>

            <form id="contractorForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Business Name</label>
                    <input type="text" id="name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                    <select id="category" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="Plumbing & Leaks">Plumbing & Leaks</option>
                        <option value="AC / HVAC Miami">AC / HVAC Miami</option>
                        <option value="EV & Smart Home">EV & Smart Home</option>
                        <option value="Luxury Remodeling">Luxury Remodeling</option>
                        <option value="Roofing & Impact Windows">Roofing & Impact Windows</option>
                        <option value="Pools & Landscaping">Pools & Landscaping</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Neighborhood / Area in Miami</label>
                    <input type="text" id="neighborhood" placeholder="e.g. Brickell, Coral Gables" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Short Description</label>
                    <textarea id="description" rows="3" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                        <input type="tel" id="phone" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Subscription Plan</label>
                    <select id="planType" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="1_month">1 Month - $10</option>
                        <option value="3_months">3 Months - $20</option>
                        <option value="6_months">6 Months - $40</option>
                        <option value="1_year">1 Year - $80</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
                    Proceed to Payment & List Business
                </button>
            </form>

            <div id="responseMessage" class="mt-4 text-center text-sm font-medium"></div>
        </div>
    </main>

    <script>
        const API_URL = 'https://homematch-miami.onrender.com';

        // Preia automat planul din URL dacă utilizatorul a apăsat un buton de abonament de pe pagina principală
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const planParam = urlParams.get('plan');
            if (planParam) {
                const planSelect = document.getElementById('planType');
                planSelect.value = planParam;
            }
        });

        document.getElementById('contractorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('responseMessage');
            
            const planPrices = {
                '1_month': 10,
                '3_months': 20,
                '6_months': 40,
                '1_year': 80
            };

            const planType = document.getElementById('planType').value;

            const formData = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                neighborhood: document.getElementById('neighborhood').value,
                description: document.getElementById('description').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                plan: planType,
                amount: planPrices[planType]
            };

            try {
                // Trimite datele către sesinea de plată Stripe configurată pe server
                const response = await fetch(`${API_URL}/api/create-subscription-session`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                if (response.ok && result.url) {
                    window.location.href = result.url; // Redirecționează către Stripe Checkout
                } else {
                    throw new Error(result.error || 'Could not initiate subscription payment');
                }
            } catch (err) {
                msgDiv.className = "mt-4 text-center text-sm font-medium text-red-600";
                msgDiv.innerText = "Error: " + err.message;
            }
        });
    </script>
</body>
</html>
